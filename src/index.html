<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width,
      initial-scale=1.0"
      name="viewport"
    />
    <title>Around the U.S</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Image of logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__image-wrapper">
            <img class="profile__image" />
            <div class="profile__image-overlay"></div>
          </div>
          <div class="profile__info">
            <h1 class="profile__title" id="profile_name"></h1>
            <button
              class="profile__edit-button"
              id="profile-edit-button"
              type="button"
            ></button>
            <p class="profile__description" id="profile_job"></p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2024 Around The U.S.</p>
      </footer>
    </div>
    <!--Edit Profile Modal-->
    <div class="modal" id="profile-edit-modal">
      <div class="modal__container">
        <button class="modal__close" id="profile-close-button"></button>
        <p class="modal__heading">Edit Profile</p>
        <form class="modal__form" name="profile-form">
          <label for="input" class="modal__label">
            <input
              type="text"
              name="profile__title"
              id="profile-title-input"
              class="modal__field"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="profile-title-input-error"></span>
          </label>
          <label for="input" class="modal__label">
            <input
              type="text"
              name="profile__description"
              id="profile-description-input"
              class="modal__field"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>
          <button class="modal__button">Save</button>
        </form>
      </div>
    </div>
    <!--Add card modal-->
    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button class="modal__close"></button>
        <p class="modal__heading">New place</p>
        <form class="modal__form" id="add-card-form" name="card-form">
          <label for="input" class="modal__label">
            <input
              type="text"
              name="name"
              id="card-title-input"
              placeholder="Title"
              class="modal__field modal__field_type_title"
              required
              minlength="1"
              maxlength="30"
            />
            <span class="modal__error" id="card-title-input-error"></span>
          </label>
          <label for="input" class="modal__label">
            <input
              type="url"
              name="link"
              placeholder="Image link"
              id="profile-description-input"
              class="modal__field modal__field_type_url"
              required
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>
          <button
            class="modal__button modal__button_disabled"
            type="submit"
            disabled
          >
            Create
          </button>
        </form>
      </div>
    </div>
    <!--Card Image Modal-->
    <div class="modal" id="card-image-modal">
      <div class="modal__card-container">
        <button class="modal__close modal__close-image"></button>
        <img src="" alt="" class="modal__image" />
        <p class="modal__image-name"></p>
      </div>
    </div>
    <!-- Change Profile Image Modal -->
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close"></button>
        <p class="modal__heading">Change profile picture</p>
        <form class="modal__form" id="avatar-form" name="avatar-form">
          <label for="input" class="modal__label">
            <input
              required
              type="url"
              class="modal__field"
              id="avatar"
              name="avatar"
              placeholder="Profile picture URL"
            />
            <span cclass="modal__error" id="avatar-error"></span>
          </label>
          <button type="submit" class="modal__button">Save</button>
        </form>
      </div>
    </div>
    <!--Card Template-->
    <template id="card-template">
      <li class="cards__card">
        <img src="" alt="" class="cards__image" />
        <button class="cards__delete-button" type="button"></button>
        <div class="cards__description">
          <h2 class="cards__title"></h2>
          <button class="cards__like-button" type="button"></button>
        </div>
      </li>
    </template>
  </body>
</html>
